services:
  hello-api:
    build:
      context: ../src/Hello.Api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: ../.env
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.development.yaml:/etc/prometheus/prometheus.yml
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - observability

networks:
  observability:

